# -- Simulation / UAV (Crazyflie, Table 2) --------------------------------------
dt: 0.05          # control timestep (s)  -> ctrl_freq = 20 Hz
ctrl_freq: 20
pyb_freq: 240     # PyBullet internal physics freq (must be multiple of ctrl_freq)
g: 9.8
mass: 0.027       # kg
drone_radius: 0.2 # collision radius (m)
obs_radius:   0.2 # obstacle sphere radius (m)
safety_cushion: 0.1
flight_bounds: 10.0
max_episode_steps: 500

# -- PPO / Reward (Table 1) ------------------------------------------------------
k_ma: 12.0        # max acceleration limit per axis (m/s^2)  [Table 2 value]
M_tr: 100.0       # terminal reward coefficient
M_ds: 1.0         # distance-shaping weight
M_bp: 10.0        # boundary penalty
M_tp: 0.1         # per-step time penalty
acceptance_radius: 0.1   # goal acceptance radius (m)

# -- PPO network / training ------------------------------------------------------
ppo_learning_rate: 3.0e-4
ppo_n_steps: 2048
ppo_batch_size: 64
ppo_n_epochs: 10
ppo_gamma: 0.99
ppo_clip_range: 0.2
ppo_ent_coef: 0.01
ppo_total_timesteps: 1_000_000

# -- ACBF (Table 1) -------------------------------------------------------------
gamma1: 0.8       # gamma1  convergence rate for safe set (first-order)
gamma2: 0.5       # gamma2  convergence rate for safe set (second-order)
gamma_max: 2.0    # alpha_max: upper bound for adaptive penalty reference
alpha_clf: 0.9    # alpha in CLF decay constraint  (0 < alpha < 1)
lambda_u: 1.0     # weight on tracking error   (lambda_u)
lambda_gamma: 10.0 # weight on adaptive safety weight (lambda_gamma)
lambda_delta: 1.0e4  # weight on slack variable  (lambda_delta)
u_max: 3.0        # physical acceleration limit  (m/s^2)
u_min: -3.0

# -- IMM ------------------------------------------------------------------------
N_pred: 5         # prediction horizon (steps)
Q_noise: 0.05     # process noise covariance scale
R_noise: 0.05     # measurement noise covariance scale
markov_diag: 0.6  # Markov transition prob (self-transition)
markov_offdiag: 0.2  # Markov transition prob (cross-transition)
ct_window: 20     # sliding window for turn-rate estimation
likelihood_smooth: 2  # moving-average window for mode likelihoods

# -- PID baseline parameters (Table 1) -----------------------------------------
pid_pos_kp: [0.4,  0.4,  1.25]
pid_pos_ki: [0.05, 0.05, 0.05]
pid_pos_kd: [0.2,  0.2,  0.5 ]
